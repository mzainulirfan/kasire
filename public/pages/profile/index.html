<section class="mx-auto max-w-5xl">
  <div class="grid gap-6 lg:grid-cols-[320px_1fr]">
    <aside class="app-card h-fit p-6">
      <div class="mb-5 inline-flex h-14 w-14 items-center justify-center rounded-xl bg-blue-100 text-blue-700">
        <i class="bx bx-user text-3xl" aria-hidden="true"></i>
      </div>
      <h2 id="profileName" class="text-lg font-semibold">Admin User</h2>
      <p id="profileEmail" class="mt-1 text-sm text-slate-600">admin@example.com</p>
      <div class="mt-5 border-t border-slate-100 pt-5">
        <p class="flex items-center gap-2 text-sm font-semibold text-slate-900">
          <i class="bx bx-shield-quarter text-lg text-blue-600" aria-hidden="true"></i>
          Role
        </p>
        <p id="profileRole" class="mt-1 text-sm text-slate-600">admin</p>
      </div>
    </aside>

    <section class="app-card p-6">
      <div class="mb-6">
        <h2 class="flex items-center gap-2 text-lg font-semibold">
          <i class="bx bx-lock-alt text-xl text-blue-600" aria-hidden="true"></i>
          Ganti Password
        </h2>
        <p class="text-sm text-slate-600">Perbarui password akun admin yang sedang login.</p>
      </div>

      <form id="profilePasswordForm" class="space-y-5" novalidate>
        <div>
          <label for="currentPassword" class="app-label">
            <i class="bx bx-key text-base text-slate-500" aria-hidden="true"></i>
            Password Saat Ini
          </label>
          <div class="password-input-wrap">
            <input id="currentPassword" name="currentPassword" type="password" class="app-input app-input-with-action" autocomplete="current-password" />
            <button type="button" class="password-toggle" data-password-toggle="currentPassword" title="Tampilkan password">
              <i class="bx bx-show text-lg" aria-hidden="true"></i>
            </button>
          </div>
          <p class="mt-1 hidden text-sm text-red-600" data-profile-error="currentPassword"></p>
        </div>

        <div>
          <label for="newPassword" class="app-label">
            <i class="bx bx-lock-open-alt text-base text-slate-500" aria-hidden="true"></i>
            Password Baru
          </label>
          <div class="password-input-wrap">
            <input id="newPassword" name="newPassword" type="password" class="app-input app-input-with-action" autocomplete="new-password" />
            <button type="button" class="password-toggle" data-password-toggle="newPassword" title="Tampilkan password">
              <i class="bx bx-show text-lg" aria-hidden="true"></i>
            </button>
          </div>
          <p class="mt-1 hidden text-sm text-red-600" data-profile-error="newPassword"></p>
        </div>

        <div>
          <label for="confirmPassword" class="app-label">
            <i class="bx bx-check-shield text-base text-slate-500" aria-hidden="true"></i>
            Konfirmasi Password
          </label>
          <div class="password-input-wrap">
            <input id="confirmPassword" name="confirmPassword" type="password" class="app-input app-input-with-action" autocomplete="new-password" />
            <button type="button" class="password-toggle" data-password-toggle="confirmPassword" title="Tampilkan password">
              <i class="bx bx-show text-lg" aria-hidden="true"></i>
            </button>
          </div>
          <p class="mt-1 hidden text-sm text-red-600" data-profile-error="confirmPassword"></p>
        </div>

        <div id="profileMessage" class="alert hidden"></div>

        <div class="flex flex-col-reverse gap-3 border-t border-slate-100 pt-5 sm:flex-row sm:items-center">
          <a href="/dashboard" class="app-button-secondary">
            <i class="bx bx-arrow-back text-lg" aria-hidden="true"></i>
            Kembali
          </a>
          <button id="saveProfileButton" type="submit" class="app-button-primary">
            <i class="bx bx-save text-lg" aria-hidden="true"></i>
            <span>Simpan Password</span>
          </button>
        </div>
      </form>
    </section>
  </div>
</section>
