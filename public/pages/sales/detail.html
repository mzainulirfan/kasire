<section class="mx-auto max-w-3xl space-y-6">
  <div id="saleDetailMessage" class="alert hidden"></div>

  <section id="saleReceipt" class="app-card hidden overflow-hidden">
    <div class="flex flex-col gap-3 border-b border-slate-200 p-5 sm:flex-row sm:items-start sm:justify-between">
      <div>
        <p class="text-sm font-medium text-slate-500">Receipt</p>
        <h2 id="receiptInvoice" class="mt-1 text-xl font-bold text-slate-900">-</h2>
        <p id="receiptDate" class="mt-1 text-sm text-slate-500">-</p>
      </div>
      <div class="flex gap-2">
        <button id="printReceiptButton" type="button" class="app-button-secondary">
          <i class="bx bx-printer text-lg" aria-hidden="true"></i>
          Print
        </button>
        <a href="/pos" class="app-button-primary">
          <i class="bx bx-cart text-lg" aria-hidden="true"></i>
          POS Baru
        </a>
      </div>
    </div>

    <div class="grid gap-4 border-b border-slate-200 p-5 sm:grid-cols-2">
      <div>
        <p class="text-xs uppercase tracking-wide text-slate-500">Customer</p>
        <p id="receiptCustomer" class="mt-1 font-bold text-slate-900">-</p>
      </div>
      <div>
        <p class="text-xs uppercase tracking-wide text-slate-500">Kasir</p>
        <p id="receiptCashier" class="mt-1 font-bold text-slate-900">-</p>
      </div>
    </div>

    <div class="p-5">
      <div id="receiptItems" class="divide-y divide-slate-100"></div>

      <div class="mt-5 space-y-2 border-t border-slate-200 pt-4">
        <div class="flex justify-between text-sm">
          <span class="text-slate-500">Subtotal</span>
          <span id="receiptSubtotal" class="font-semibold text-slate-900">Rp0</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-slate-500">Diskon</span>
          <span class="text-right">
            <span id="receiptDiscount" class="font-semibold text-slate-900">Rp0</span>
            <span id="receiptDiscountMeta" class="block text-xs text-slate-500">-</span>
          </span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-slate-500">Pajak</span>
          <span id="receiptTax" class="font-semibold text-slate-900">Rp0</span>
        </div>
        <div class="flex justify-between border-t border-slate-200 pt-3 text-lg font-bold">
          <span>Total</span>
          <span id="receiptTotal">Rp0</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-slate-500">Metode</span>
          <span id="receiptPaymentMethod" class="font-semibold uppercase text-slate-900">-</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-slate-500">Dibayar</span>
          <span id="receiptPaidAmount" class="font-semibold text-slate-900">Rp0</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-slate-500">Kembalian</span>
          <span id="receiptChangeAmount" class="font-semibold text-slate-900">Rp0</span>
        </div>
      </div>
    </div>
  </section>
</section>
