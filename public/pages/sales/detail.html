<section class="mx-auto max-w-4xl space-y-5">
  <div id="saleDetailMessage" class="alert hidden receipt-print-hidden"></div>

  <div class="receipt-screen-actions flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <p class="text-sm font-medium text-slate-500">Receipt</p>
      <h1 class="text-2xl font-bold tracking-tight text-slate-950">Detail Transaksi</h1>
    </div>

    <div class="flex flex-wrap gap-2">
      <a href="/sales" class="app-button-secondary">
        <i class="bx bx-left-arrow-alt text-lg" aria-hidden="true"></i>
        Kembali
      </a>
      <button id="printReceiptButton" type="button" class="app-button-secondary">
        <i class="bx bx-printer text-lg" aria-hidden="true"></i>
        Print
      </button>
      <a href="/pos" class="app-button-primary">
        <i class="bx bx-cart text-lg" aria-hidden="true"></i>
        POS Baru
      </a>
    </div>
  </div>

  <section id="saleReceipt" class="app-card receipt-shell hidden overflow-hidden">
    <div class="receipt-print-header border-b border-slate-200 p-5 text-center">
      <p class="text-xl font-black tracking-tight text-slate-950">KASIRE</p>
      <p class="text-xs font-medium text-slate-500">Point of Sale</p>
      <div class="mt-4">
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Invoice</p>
        <h2 id="receiptInvoice" class="mt-1 text-xl font-bold text-slate-900">-</h2>
        <p id="receiptDate" class="mt-1 text-sm text-slate-500">-</p>
      </div>
    </div>

    <div class="grid gap-4 border-b border-slate-200 p-5 sm:grid-cols-3">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Customer</p>
        <p id="receiptCustomer" class="mt-1 font-bold text-slate-900">-</p>
      </div>
      <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Kasir</p>
        <p id="receiptCashier" class="mt-1 font-bold text-slate-900">-</p>
      </div>
      <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Pembayaran</p>
        <p id="receiptPaymentMethod" class="mt-1 font-bold uppercase text-slate-900">-</p>
      </div>
    </div>

    <div class="p-5">
      <div class="mb-3 flex items-center justify-between">
        <h3 class="text-sm font-bold uppercase tracking-wide text-slate-500">Item Transaksi</h3>
      </div>

      <div id="receiptItems" class="divide-y divide-slate-100"></div>

      <div class="mt-5 space-y-2 border-t border-slate-200 pt-4">
        <div class="receipt-summary-row flex justify-between gap-4 text-sm">
          <span class="text-slate-500">Subtotal</span>
          <span id="receiptSubtotal" class="font-semibold text-slate-900">Rp0</span>
        </div>
        <div class="receipt-summary-row flex justify-between gap-4 text-sm">
          <span class="text-slate-500">Diskon</span>
          <span class="text-right">
            <span id="receiptDiscount" class="font-semibold text-slate-900">Rp0</span>
            <span id="receiptDiscountMeta" class="block text-xs text-slate-500">-</span>
          </span>
        </div>
        <div class="receipt-summary-row flex justify-between gap-4 text-sm">
          <span class="text-slate-500">Pajak</span>
          <span id="receiptTax" class="font-semibold text-slate-900">Rp0</span>
        </div>
        <div class="receipt-total-row flex justify-between gap-4 border-t border-slate-200 pt-3 text-lg font-black text-slate-950">
          <span>Total</span>
          <span id="receiptTotal">Rp0</span>
        </div>
        <div class="receipt-summary-row flex justify-between gap-4 text-sm">
          <span class="text-slate-500">Dibayar</span>
          <span id="receiptPaidAmount" class="font-semibold text-slate-900">Rp0</span>
        </div>
        <div class="receipt-summary-row flex justify-between gap-4 text-sm">
          <span class="text-slate-500">Kembalian</span>
          <span id="receiptChangeAmount" class="font-semibold text-slate-900">Rp0</span>
        </div>
      </div>

      <p class="mt-6 text-center text-sm font-semibold text-slate-500">Terima kasih</p>
    </div>
  </section>
</section>
