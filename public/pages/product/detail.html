<section class="mx-auto max-w-6xl space-y-6">
  <div id="productDetailMessage" class="alert hidden"></div>

  <section id="productDetailCard" class="app-card hidden overflow-hidden">
    <div class="flex flex-col gap-4 border-b border-slate-200 p-6 sm:flex-row sm:items-start sm:justify-between">
      <div class="min-w-0">
        <p id="detailProductSku" class="mb-3 inline-flex rounded-full bg-slate-100 px-3 py-1 text-xs font-bold uppercase tracking-wide text-slate-600">-</p>
        <h2 id="detailProductName" class="text-3xl font-bold tracking-tight text-slate-950">-</h2>
        <p id="detailProductIdentity" class="mt-2 text-sm text-slate-500">-</p>
      </div>
      <a href="/products" class="app-button-secondary shrink-0">
        <i class="bx bx-left-arrow-alt text-lg" aria-hidden="true"></i>
        Kembali
      </a>
    </div>

    <div class="grid gap-6 p-6 lg:grid-cols-[280px_minmax(0,1fr)]">
      <div class="space-y-3">
        <div id="detailProductMainImageWrap" class="overflow-hidden rounded-xl border border-slate-200 bg-slate-50">
          <div class="flex aspect-square items-center justify-center">
            <div class="text-center">
              <span class="mx-auto inline-flex h-20 w-20 items-center justify-center rounded-2xl bg-white text-emerald-700 shadow-sm">
                <i class="bx bx-image-add text-4xl" aria-hidden="true"></i>
              </span>
              <p class="mt-3 text-sm font-semibold text-slate-600">Foto Utama</p>
            </div>
          </div>
        </div>

        <div id="detailProductThumbnails" class="grid grid-cols-4 gap-2"></div>
      </div>

      <div>
        <div class="grid gap-4 border-b border-slate-200 pb-6 sm:grid-cols-3">
          <div>
            <p class="text-sm font-medium text-slate-500">Harga</p>
            <p id="detailProductPrice" class="mt-1 text-2xl font-bold text-slate-950">-</p>
          </div>
          <div>
            <p class="text-sm font-medium text-slate-500">Stok</p>
            <p id="detailProductStock" class="mt-1 text-2xl font-bold text-slate-950">-</p>
          </div>
          <div>
            <p class="text-sm font-medium text-slate-500">Status</p>
            <p class="mt-2">
              <span id="detailProductStatus" class="status-badge">-</span>
            </p>
          </div>
        </div>

        <dl class="mt-6 grid gap-4 sm:grid-cols-2">
          <div>
            <dt class="text-sm text-slate-500">Kategori</dt>
            <dd id="detailProductCategory" class="mt-1 font-semibold text-slate-900">-</dd>
          </div>
          <div>
            <dt class="text-sm text-slate-500">Nilai Stok</dt>
            <dd id="detailProductStockValue" class="mt-1 font-semibold text-slate-900">-</dd>
          </div>
          <div>
            <dt class="text-sm text-slate-500">ID Product</dt>
            <dd id="detailProductId" class="mt-1 font-semibold text-slate-900">-</dd>
          </div>
          <div>
            <dt class="text-sm text-slate-500">Tanggal Dibuat</dt>
            <dd id="detailProductCreatedAt" class="mt-1 font-semibold text-slate-900">-</dd>
          </div>
        </dl>
      </div>
    </div>
  </section>

  <section class="app-card p-5">
    <h3 class="text-sm font-bold uppercase tracking-wide text-slate-500">Ringkasan</h3>
    <p id="detailProductInventoryNote" class="mt-4 text-sm font-semibold leading-6 text-slate-800">-</p>
    <p id="detailProductAvailability" class="mt-3 text-sm leading-6 text-slate-600">-</p>
  </section>
</section>
