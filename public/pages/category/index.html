<section class="space-y-6">
  <div id="categoryMessage" class="alert hidden"></div>

  <section class="grid gap-6 lg:grid-cols-[minmax(0,420px)_1fr]">
    <section class="app-card p-5">
      <div class="mb-5 border-b border-slate-200 pb-4">
        <h2 class="text-lg font-bold text-slate-900">Tambah Category</h2>
        <p class="text-sm text-slate-500">Category ini akan muncul di pilihan category product.</p>
      </div>

      <form id="categoryForm" class="space-y-4">
        <div>
          <label class="app-label" for="categoryName">
            <i class="bx bx-category text-base text-slate-400" aria-hidden="true"></i>
            Nama Category
          </label>
          <input id="categoryName" name="name" class="app-input" type="text" autocomplete="off" />
          <p data-category-error="name" class="mt-1 hidden text-sm text-red-600"></p>
        </div>

        <button id="categorySubmitButton" type="submit" class="app-button-primary">
          <i class="bx bx-save text-lg" aria-hidden="true"></i>
          <span>Simpan Category</span>
        </button>
      </form>
    </section>

    <section class="app-card overflow-hidden">
      <div class="flex flex-col gap-3 border-b border-slate-200 p-4 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h2 class="text-lg font-bold text-slate-900">Data Category</h2>
          <p class="text-sm text-slate-500">Hapus category hanya bisa jika belum dipakai product.</p>
        </div>
        <div class="relative w-full sm:w-72">
          <i class="bx bx-search absolute left-3 top-1/2 -translate-y-1/2 text-lg text-slate-400" aria-hidden="true"></i>
          <input id="categorySearch" class="app-input app-input-with-icon" type="search" placeholder="Cari category..." />
        </div>
      </div>

      <div id="categoryTableWrapper" class="overflow-x-auto">
        <table class="w-full min-w-[520px] text-left">
          <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
            <tr>
              <th class="px-4 py-3 font-bold">Category</th>
              <th class="px-4 py-3 font-bold">Dibuat</th>
              <th class="px-4 py-3 text-right font-bold">Aksi</th>
            </tr>
          </thead>
          <tbody id="categoryTable" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

      <div id="categoryEmptyState" class="hidden p-8 text-center">
        <i class="bx bx-category text-4xl text-slate-300" aria-hidden="true"></i>
        <p class="mt-2 text-sm font-medium text-slate-600">Belum ada category.</p>
      </div>
    </section>
  </section>

  <div id="deleteCategoryModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="deleteCategoryTitle">
    <section class="modal-panel">
      <div class="flex items-start gap-3">
        <span class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-red-100 text-red-600">
          <i class="bx bx-trash text-xl" aria-hidden="true"></i>
        </span>
        <div>
          <h3 id="deleteCategoryTitle" class="text-base font-bold text-slate-900">Hapus category?</h3>
          <p id="deleteCategoryText" class="mt-1 text-sm text-slate-600">Category yang dihapus tidak bisa dikembalikan.</p>
        </div>
      </div>
      <div class="mt-5 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <button id="cancelDeleteCategoryButton" type="button" class="app-button-secondary">Batal</button>
        <button id="confirmDeleteCategoryButton" type="button" class="delete-button">
          <i class="bx bx-trash text-base" aria-hidden="true"></i>
          <span>Hapus Category</span>
        </button>
      </div>
    </section>
  </div>
</section>
